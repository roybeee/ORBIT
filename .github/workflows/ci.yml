name: Validate Orbit
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: orbit-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:planner
      - run: npm run test:storage
      - run: npm run test:notes
      - run: npm run test:pwa
      - run: npm run test:agent
      - run: npm run build
      - run: npm run test:smoke
