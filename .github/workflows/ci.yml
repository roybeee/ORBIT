name: Validate Orbit
on:
  push:
    branches: [main]
  pull_request:
  # Only reached if the repository ever moves to an organization and enables a
  # merge queue; today the gate is a required check on an up-to-date head.
  merge_group:
permissions:
  contents: read
concurrency:
  group: orbit-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Fetch the integration base for the migration check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && ! echo "$BASE_SHA" | grep -Eq '^0+$'; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            echo "MIGRATION_BASE=$BASE_SHA" >> "$GITHUB_ENV"
          fi
      - name: Migration history is append-only and consistent
        run: node scripts/check-migrations.mjs ${MIGRATION_BASE:+--base "$MIGRATION_BASE"}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
