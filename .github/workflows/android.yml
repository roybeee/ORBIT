name: Android app

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Build a signed Play Store AAB using configured secrets'
        required: true
        type: boolean
        default: false
      version_code:
        description: 'Unique increasing Play Store version code'
        required: true
        type: string
        default: '1'
      version_name:
        description: 'User-visible version'
        required: true
        type: string
        default: '0.1.0'

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint, and build installable beta
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Check APK signature
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk"
      - name: Upload beta APK and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-android-beta-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release
    needs: beta
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: android-release
    defaults:
      run:
        working-directory: android
    env:
      ORBIT_KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
      ORBIT_KEYSTORE_PASSWORD: ${{ secrets.ORBIT_KEYSTORE_PASSWORD }}
      ORBIT_KEY_ALIAS: ${{ secrets.ORBIT_KEY_ALIAS }}
      ORBIT_KEY_PASSWORD: ${{ secrets.ORBIT_KEY_PASSWORD }}
      ORBIT_VERSION_CODE: ${{ inputs.version_code }}
      ORBIT_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Load upload signing key
        shell: bash
        run: |
          set -euo pipefail
          for secret in ORBIT_KEYSTORE_BASE64 ORBIT_KEYSTORE_PASSWORD ORBIT_KEY_ALIAS ORBIT_KEY_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              echo "::error::Missing Android release secret: $secret"
              exit 1
            fi
          done
          umask 077
          key_file="$RUNNER_TEMP/orbit-upload.jks"
          printf '%s' "$ORBIT_KEYSTORE_BASE64" | base64 --decode > "$key_file"
          echo "ORBIT_KEYSTORE_FILE=$key_file" >> "$GITHUB_ENV"
      - name: Build signed Play Store bundle
        run: ./gradlew --no-daemon lintRelease bundleRelease -PorbitVersionCode="$ORBIT_VERSION_CODE" -PorbitVersionName="$ORBIT_VERSION_NAME"
      - name: Verify bundle signature
        run: |
          set -euo pipefail
          result=$(jarsigner -verify app/build/outputs/bundle/release/app-release.aab)
          printf '%s\n' "$result"
          [[ "$result" == *'jar verified.'* ]]
      - name: Upload Play Store bundle and mapping
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-play-release-${{ inputs.version_code }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/reports/lint-results-release.html
          if-no-files-found: error
          retention-days: 30
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/orbit-upload.jks"
